name: CI

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read

jobs:
  engine:
    name: Motor de pesquisa (Python) — testes T-001…T-013 e laboratório
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install flask==3.1.3 werkzeug==3.1.9 requests==2.34.2 reportlab==5.0.1 pytest==9.1.1
      - run: python -m pytest -q -p no:logging tests

  engine-security:
    name: Gates de segurança do motor (SAST, SCA, segredos)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: SAST (Bandit) — falha em severidade alta
        run: pip install bandit && bandit -q -r engine/chl_engine -lll
      - name: SCA (pip-audit)
        run: pip install pip-audit && pip-audit -r engine/requirements.txt
      - name: Segredos (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  web:
    name: App Next.js — instalação, tipos e build (linha de base)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --no-audit --no-fund
      - run: npx tsc --noEmit
      - run: npm run build
